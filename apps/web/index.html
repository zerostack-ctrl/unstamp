<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0b0d10" />
<title>Unstamp — Strip any watermark</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="assets/icons/icon-192.png" />
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" class="logo" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span>Unstamp</span>
  </div>
  <button id="btnPalette" class="ghost" title="Ctrl+K">⌘K</button>
</header>

<main class="layout">
  <aside class="panel">
    <section class="card">
      <h2>1. What are you removing?</h2>
      <label for="preset">Preset</label>
      <select id="preset">
        <option value="">Custom</option>
        <option value="sora">Sora</option>
        <option value="veo">Veo</option>
        <option value="gemini">Gemini</option>
        <option value="dalle">DALL·E</option>
        <option value="midjourney">Midjourney</option>
        <option value="synthid">SynthID (frequency)</option>
      </select>

      <label for="watermark-text">Watermark text</label>
      <input id="watermark-text" placeholder="e.g. Gemini, Sora, DALL·E" />

      <label for="watermark-colour">Colour</label>
      <select id="watermark-colour">
        <option value="auto">Auto</option>
        <option value="white">White</option>
        <option value="black">Black</option>
      </select>

      <label for="watermark-angle">Angle <output id="angle-out">auto</output></label>
      <input id="watermark-angle" type="range" min="-60" max="60" step="1" value="0" />
      <label class="checkbox"><input id="watermark-angle-auto" type="checkbox" checked /> Auto-detect angle</label>

      <label class="checkbox"><input id="watermark-tiled" type="checkbox" /> Repeated / tiled</label>
      <label class="checkbox"><input id="watermark-outline" type="checkbox" /> Has outline / shadow</label>
      <label class="checkbox"><input id="watermark-transparent" type="checkbox" checked /> Transparent (alpha-invert)</label>
      <label class="checkbox"><input id="strip-metadata" type="checkbox" checked /> Strip hidden metadata</label>
      <label class="checkbox"><input id="safe-mode" type="checkbox" /> Safe mode (skip faces)</label>

      <label for="template-file">Or upload a template (logo)</label>
      <input id="template-file" type="file" accept="image/*" />
    </section>

    <section class="card">
      <h2>2. Refine</h2>
      <div class="toolbar">
        <button data-tool="brush" class="active">Brush</button>
        <button data-tool="eraser">Eraser</button>
      </div>
      <label for="brush-size">Brush <output id="brush-out">40</output></label>
      <input id="brush-size" type="range" min="4" max="200" value="40" />
      <div class="row">
        <button id="btnUndo">Undo</button>
        <button id="btnRedo">Redo</button>
        <button id="btnClear">Clear</button>
      </div>
    </section>

    <section class="card">
      <h2>3. Remove</h2>
      <label for="model">Model</label>
      <select id="model">
        <option value="auto">Auto (best)</option>
        <option value="migan">MI-GAN (fast)</option>
        <option value="lama">LaMa (quality)</option>
        <option value="ensemble">Ensemble (slowest, best)</option>
      </select>
      <label class="checkbox"><input id="post-denoise" type="checkbox" checked /> Denoise after</label>
      <label class="checkbox"><input id="post-sharpen" type="checkbox" checked /> Sharpen after</label>
      <button id="btnDetect" class="primary">Detect</button>
      <button id="btnRemove" class="primary" disabled>Remove watermark</button>
      <button id="btnDownload" disabled>Download result</button>
      <button id="btnBatch">Batch…</button>
    </section>
  </aside>

  <section class="workspace">
    <div id="drop" class="drop">
      <p>Drop an image here, or <button id="btnBrowse" class="link">browse</button></p>
      <input id="file" type="file" accept="image/*" hidden />
    </div>
    <div id="stage" hidden>
      <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
        <canvas id="overlay"></canvas>
        <div id="compare" hidden></div>
      </div>
      <div id="thumbs" class="thumbs"></div>
    </div>
  </section>
</main>

<dialog id="palette" class="palette">
  <input id="palette-input" placeholder="Type a command…" autocomplete="off" />
  <ul id="palette-list"></ul>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
